<app-header></app-header>
<div class="requests-container">
  <!-- Alerts -->
  <div *ngIf="facade.successMessage()" class="alert alert-success">{{ facade.successMessage() }}</div>
  <div *ngIf="facade.errorMessage()" class="alert alert-danger">{{ facade.errorMessage() }}</div>

  <h2>Team Pending Requests</h2>


  <div *ngIf="facade.isLoading()" class="loading">Loading requests...</div>

  <table *ngIf="!facade.isLoading() && facade.requests().length > 0" class="requests-table">
    <thead>
      <tr>
        <th>Employee</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
        <th>Updated At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let req of facade.requests()">
        <td>{{ req.employeeName }}</td>
        <td>{{ req.startDate }}</td>
        <td>{{ req.endDate }}</td>
        
        <td><span class="badge">{{ req.status }}</span></td>
        <td>{{ req.updatedAt | date:'medium' }}</td>
        <td>
          <button class="btn-accept" (click)="approve(req.id)">Approve</button>
          <button class="btn-reject" (click)="reject(req.id)">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!facade.isLoading() && facade.requests().length === 0" class="no-data">No pending requests found.</p>
</div>

<app-footer></app-footer>
