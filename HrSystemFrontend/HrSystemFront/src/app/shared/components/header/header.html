<header class="dashboard-header">
  <div class="header-brand">
    <div class="brand-logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
        <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0m-3-6a3 3 0 1 0-6 0 3 3 0 0 0 6 0M8 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4"/>
        <path d="M8.256 14a4.474 4.474 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10c.26 0 .507.009.74.025.226-.341.487-.65.778-.922C8.952 8.922 8.49 8.5 8 8.5c-2.618 0-4 1.25-4 2.5 0 1.125.875 2 2 2z"/>
      </svg>
    </div>
    <h2>HR Portal</h2>
  </div>

  <!-- Mobile Menu Toggle Button -->
  <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <div class="header-actions" [class.mobile-open]="isMobileMenuOpen">
    <nav class="nav-links">
      <a routerLink="/dashboard" (click)="closeMobileMenu()">Dashboard</a>
      <a routerLink="/leave-requests" *ngIf="isEmployee || isManager" (click)="closeMobileMenu()">My Leave Requests</a>
      <a routerLink="/team-requests" *ngIf="isAdmin || isManager" (click)="closeMobileMenu()">Team Requests</a>
      <a routerLink="/leave-policies" *ngIf="isAdmin" (click)="closeMobileMenu()">Leave Policies</a>
      <a routerLink="/public-holidays" *ngIf="isAdmin" (click)="closeMobileMenu()">Public Holidays</a>
    </nav>
    <button class="logout-btn" (click)="onLogout()">Logout</button>
  </div>
</header>
